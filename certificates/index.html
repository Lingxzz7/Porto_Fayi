<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikat | Portofolio Fayi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-theme="dark">
<nav class="fixed w-full z-50 top-0 transition-colors duration-500" style="background: var(--nav-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color);">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="../intro/" class="text-xl font-bold tracking-[0.15em]" style="color: var(--text-main)">
            FAYI<span class="text-cyan-400">.</span>
        </a>
        <div class="flex items-center space-x-8">
            <div class="hidden md:flex space-x-8 text-[10px] uppercase tracking-[0.2em] font-bold">
                <a href="../intro/" class="hover:text-cyan-400 transition" style="color: var(--text-muted)">Intro</a>
                <a href="../skills/" class="hover:text-cyan-400 transition" style="color: var(--text-muted)">Skills</a>
                <a href="../certificates/" class="hover:text-cyan-400 transition" style="color: var(--text-muted)">Certificates</a>
                <a href="../projects/" class="hover:text-cyan-400 transition" style="color: var(--text-muted)">Projects</a>
            </div>
            <button onclick="toggleTheme()" class="theme-toggle" id="themeBtn" aria-label="Ganti tema">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>
</nav>
<main>
<section id="certificates" class="py-24">
        <div class="max-w-6xl mx-auto px-6">
            <h2 class="text-4xl font-black mb-16 tracking-tighter uppercase">Verified <span class="text-cyan-400 italic">Credentials.</span></h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
                <button onclick="viewCertificate('falah')" class="p-6 cyber-border rounded-2xl text-left hover:bg-cyan-500/5 transition group">
                    <i class="fas fa-building text-cyan-400 mb-4"></i>
                    <h4 class="font-bold mb-2 italic" style="color: var(--text-main)">PT Falah Inovasi Teknologi</h4>
                    <p class="text-xs uppercase tracking-widest" style="color: var(--text-muted)">Praktik Kerja Industri</p>
                </button>
                <button onclick="viewCertificate('internship')" class="p-6 cyber-border rounded-2xl text-left hover:bg-cyan-500/5 transition group">
                    <i class="fas fa-user-check text-cyan-400 mb-4"></i>
                    <h4 class="font-bold mb-2 italic" style="color: var(--text-main)">PUPR Internship</h4>
                    <p class="text-xs uppercase tracking-widest" style="color: var(--text-muted)">Sertifikat Magang</p>
                </button>
                <button onclick="viewCertificate('cybermedia')" class="p-6 cyber-border rounded-2xl text-left hover:bg-cyan-500/5 transition group">
                    <i class="fas fa-graduation-cap text-cyan-400 mb-4"></i>
                    <h4 class="font-bold mb-2 italic" style="color: var(--text-main)">Graduate SMK</h4>
                    <p class="text-xs uppercase tracking-widest" style="color: var(--text-muted)">Cyber Media Sertifikat</p>
                </button>
            </div>

            <div class="pdf-viewer-container cyber-border p-4">
                <div id="pdfView" class="w-full h-full bg-black/20 rounded-xl relative flex items-center justify-center">
                    <div id="pdfPlaceholder" class="flex flex-col items-center opacity-30">
                        <i class="fas fa-file-pdf text-4xl mb-4"></i>
                        <span class="text-xs tracking-widest uppercase">Pilih sertifikat untuk pratinjau</span>
                    </div>
                    <img id="certificateImage" class="w-full h-full rounded-lg object-contain hidden" alt="">
                    <iframe id="pdfFrame" class="w-full h-full rounded-lg hidden" src="" frameborder="0"></iframe>
                </div>
            </div>
        </div>
    </section>
</main>
<footer class="py-20 border-t border-white/5 text-center">
        <p class="text-[10px] font-bold tracking-[0.5em] uppercase opacity-40">&copy; FAYI PORTOFOLIO</p>
    </footer>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/certificates.js"></script>
</body>
</html>
